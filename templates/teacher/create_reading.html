{% extends 'layout/base.html' %}
{% block content %}

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-header bg-primary text-white p-4 rounded-top-4 d-flex justify-content-between align-items-center">
                    <h4 class="mb-0 fw-bold"><i class="fas fa-plus-circle me-2"></i>Tạo Bài Đọc Mới (Draft)</h4>
                    <a href="{{ url_for('teacher.dashboard') }}" class="btn btn-sm btn-light text-primary fw-bold">Trở về</a>
                </div>

                <div class="card-body p-4 p-md-5">
                    <form action="{{ url_for('teacher.create_reading') }}" method="POST">

                        <div class="mb-4">
                            <label for="title" class="form-label fw-bold">Tiêu đề bài tập <span class="text-danger">*</span></label>
                            <input type="text" class="form-control form-control-lg" id="title" name="title" placeholder="VD: The History of Computers" required>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label for="level" class="form-label fw-bold">Cấp độ CEFR <span class="text-danger">*</span></label>
                                <select class="form-select form-select-lg" id="level" name="level" required>
                                    <option value="" disabled selected>-- Chọn cấp độ --</option>
                                    <option value="A1">A1 - Beginner</option>
                                    <option value="A2">A2 - Elementary</option>
                                    <option value="B1">B1 - Intermediate</option>
                                    <option value="B2">B2 - Upper Intermediate</option>
                                    <option value="C1">C1 - Advanced</option>
                                    <option value="C2">C2 - Proficient</option>
                                </select>
                            </div>
                            <div class="col-md-6 mt-3 mt-md-0">
                                <label for="time_limit" class="form-label fw-bold">Thời gian làm bài (Phút) <span class="text-danger">*</span></label>
                                <input type="number" class="form-control form-control-lg" id="time_limit" name="time_limit" min="5" max="60" value="15" required>
                                <div class="form-text">Tối thiểu 5 phút, tối đa 60 phút.</div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="content" class="form-label fw-bold">Nội dung đoạn văn <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="content" name="content" rows="12" placeholder="Dán nội dung đoạn văn bằng tiếng Anh vào đây..." required></textarea>
                        </div>

                        <div class="d-grid mt-5">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold rounded-pill">
                                <i class="fas fa-save me-2"></i>Lưu Bản Nháp & Tiếp Tục
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
