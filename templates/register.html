{% extends 'layout/base.html' %}
{% block content %}

<div class="container d-flex justify-content-center align-items-center mb-5" style="min-height: calc(100vh - 200px);">

    <div class="card shadow-lg border-0 rounded-4 w-100" style="max-width: 550px;">

        <div class="card-header bg-primary text-white text-center py-4 rounded-top-4 border-0">
            <h3 class="fw-bold mb-1">Đăng Ký Tài Khoản</h3>
            <p class="mb-0 small text-white-50">Hệ Thống Hỗ Trợ Tự Học Tiếng Anh</p>
        </div>

        <div class="card-body p-4 p-md-5">
            <form action="{{ url_for('user.register_page') }}" method="post">
                {# {{ register_user_form.hidden_tag() }} #}

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="first_name" class="form-label fw-semibold text-secondary small mb-1">Họ và
                            đệm</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i
                                    class="fas fa-id-card text-muted"></i></span>
                            <input type="text" class="form-control border-start-0" id="first_name" name="first_name"
                                   placeholder="Ví dụ: Nguyễn Văn" required/>
                        </div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="last_name" class="form-label fw-semibold text-secondary small mb-1">Tên</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
                            <input type="text" class="form-control border-start-0" id="last_name" name="last_name"
                                   placeholder="Ví dụ: A" required/>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold text-secondary small mb-1">Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fas fa-envelope text-muted"></i></span>
                        <input type="email" class="form-control border-start-0" id="email" name="email"
                               placeholder="Nhập địa chỉ email" required/>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label fw-semibold text-secondary small mb-1">Số điện thoại</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i
                                class="fas fa-phone text-muted"></i></span>
                        <input type="text" class="form-control border-start-0" id="phone" name="phone"
                               placeholder="Nhập số điện thoại" required/>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold text-secondary small mb-1">Mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i
                                class="fas fa-lock text-muted"></i></span>
                        <input type="password" class="form-control border-start-0" id="password" name="password"
                               placeholder="Tạo mật khẩu" required/>
                        <button class="btn btn-light border border-start-0" type="button" id="togglePassword"
                                tabindex="-1">
                            <i class="fas fa-eye text-muted" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="confirm_password" class="form-label fw-semibold text-secondary small mb-1">Xác nhận mật
                        khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i
                                class="fas fa-check-circle text-muted"></i></span>
                        <input type="password" class="form-control border-start-0" id="confirm_password"
                               name="confirm_password" placeholder="Nhập lại mật khẩu" required/>
                        <button class="btn btn-light border border-start-0" type="button" id="toggleConfirmPassword"
                                tabindex="-1">
                            <i class="fas fa-eye text-muted" id="eyeIconConfirm"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 mb-4 fw-bold rounded-pill transition-hover">
                    Đăng Ký
                </button>

                <div class="text-center">
                    <p class="text-secondary small mb-0">
                        Đã có tài khoản? <a href="{{ url_for('user.login_page') }}"
                                            class="text-decoration-none fw-bold text-primary">Đăng nhập ngay</a>
                    </p>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {

    // 1. Xử lý ẩn/hiện cho ô Mật khẩu
    const togglePasswordBtn = document.getElementById('togglePassword');
    if (togglePasswordBtn) {
        togglePasswordBtn.addEventListener('click', function () {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        });
    }

    // 2. Xử lý ẩn/hiện cho ô Xác nhận mật khẩu
    const toggleConfirmPasswordBtn = document.getElementById('toggleConfirmPassword');
    if (toggleConfirmPasswordBtn) {
        toggleConfirmPasswordBtn.addEventListener('click', function () {
            const confirmPasswordInput = document.getElementById('confirm_password');
            const eyeIconConfirm = document.getElementById('eyeIconConfirm');

            if (confirmPasswordInput.type === 'password') {
                confirmPasswordInput.type = 'text';
                eyeIconConfirm.classList.remove('fa-eye');
                eyeIconConfirm.classList.add('fa-eye-slash');
            } else {
                confirmPasswordInput.type = 'password';
                eyeIconConfirm.classList.remove('fa-eye-slash');
                eyeIconConfirm.classList.add('fa-eye');
            }
        });
    }

});
</script>

{% endblock %}
