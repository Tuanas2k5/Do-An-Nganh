{% extends 'layout/base.html' %}
{% block content %}

<div class="container d-flex justify-content-center align-items-center mb-5" style="margin-top: 100px; min-height: calc(100vh - 200px);">

    <div class="card shadow-lg border-0 rounded-4 w-100" style="max-width: 450px;">

        <div class="card-header bg-primary text-white text-center py-4 rounded-top-4 border-0">
            <h3 class="fw-bold mb-1">Đăng Nhập</h3>
            <p class="mb-0 small text-white-50">Hệ Thống Hỗ Trợ Tự Học Tiếng Anh</p>
        </div>

        <div class="card-body p-4 p-md-5">
            <form action="{{ url_for('user.login_page') }}" method="post">
                {# {{ login_user_form.hidden_tag() }} #}

                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold text-secondary small mb-1">Tên đăng nhập / Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
                        <input type="text" class="form-control border-start-0" id="username" name="email" placeholder="Nhập tài khoản" required/>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold text-secondary small mb-1">Mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                        <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="Nhập mật khẩu" required/>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember" name="remember"/>
                        <label class="form-check-label text-secondary small" for="remember">
                            Ghi nhớ tôi
                        </label>
                    </div>
                    <a href="#" class="text-decoration-none small text-primary fw-medium">Quên mật khẩu?</a>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 mb-4 fw-bold rounded-pill transition-hover">
                    Đăng Nhập
                </button>

                <div class="text-center">
                    <p class="text-secondary small mb-0">
                        Chưa có tài khoản? <a href="#" class="text-decoration-none fw-bold text-primary">Đăng ký ngay</a>
                    </p>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
