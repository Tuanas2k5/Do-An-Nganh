{% extends 'layout/base.html' %}
{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5">
                <div class="text-center mb-4">
                    <h3 class="fw-bold"><i class="fas fa-sign-in-alt text-primary me-2"></i>Đăng Nhập</h3>
                    <p class="text-muted">Truy cập vào LearnEng - Hệ thống hỗ trợ tự học tiếng Anh</p>
                </div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i
                                    class="fas fa-envelope text-muted"></i></span>
                            <input type="email" id="email" class="form-control bg-light border-start-0" required
                                   placeholder="Nhập email của bạn">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Mật khẩu</label>
                        <!-- Input Group chứa nút hiện mật khẩu -->
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                            <input type="password" id="password"
                                   class="form-control bg-light border-start-0 border-end-0" required
                                   placeholder="Nhập mật khẩu">
                            <button class="btn btn-light border border-start-0" type="button" id="togglePassword"
                                    tabindex="-1">
                                <i class="fas fa-eye text-muted" id="eyeIcon"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Khung hiển thị thông báo lỗi từ API -->
                    <div id="errorMessage" class="alert alert-danger d-none py-2 text-center fw-medium"></div>

                    <button type="submit" id="submitBtn"
                            class="btn btn-primary w-100 rounded-pill fw-bold py-2 shadow-sm">
                        <i class="fas fa-arrow-right me-2"></i>ĐĂNG NHẬP
                    </button>
                </form>
                <div class="text-center mt-4">
                    <p class="mb-0 text-muted">Chưa có tài khoản? <a href="{{url_for('user.register_page')}}"
                                                                     class="text-primary fw-bold text-decoration-none">Đăng
                        ký ngay</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/login.js') }}"></script>

{% endblock %}
